name: Deploy on Render

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
        - name: Deploy Backend
          run: |
            curl -X POST "${{ secrets.BACKEND_DEPLOY_HOOK }}"

        - name: Deploy Frontend
          run: |
             curl -X POST "${{ secrets.FRONTEND_DEPLOY_HOOK }}"