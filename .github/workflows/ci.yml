name: CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        working-directory: ./Frontend
        run: npm ci

      - name: Frontend Lint
        working-directory: ./Frontend
        run: npm run lint

      - name: Frontend Build
        working-directory: ./Frontend
        run: npm run build

      - name: Install Backend Dependencies
        working-directory: ./Backend
        run: npm ci 